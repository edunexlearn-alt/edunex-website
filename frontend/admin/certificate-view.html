<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate | Edunex Academy</title>
    <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg">
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #0b2a5b;
            --navy-deep: #071f45;
            --gold: #c9a227;
            --gold-soft: #d4b84a;
            --ink: #1a2436;
            --muted: #5a6578;
            --cream: #fbf8f1;
            --line: #d8c98a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #1e1e1e;
            font-family: 'Montserrat', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            padding: 20px;
        }

        .toolbar {
            width: 1122px;
            max-width: 100%;
            margin: 0 auto 14px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .toolbar button {
            border: 0;
            background: var(--navy);
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
        }

        .toolbar button.secondary { background: #555; }

        /* A4 landscape ≈ 1123 × 794 at 96dpi */
        .sheet {
            width: 1122px;
            height: 793px;
            max-width: 100%;
            margin: 0 auto;
            background:
                radial-gradient(ellipse at 70% 45%, rgba(11, 42, 91, 0.03), transparent 55%),
                linear-gradient(180deg, #fffef9 0%, var(--cream) 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        }

        /* Soft side waves */
        .sheet::before,
        .sheet::after {
            content: '';
            position: absolute;
            top: 8%;
            bottom: 12%;
            width: 120px;
            opacity: 0.07;
            background:
                repeating-linear-gradient(
                    180deg,
                    transparent 0 10px,
                    rgba(11, 42, 91, 0.35) 10px 11px
                );
            pointer-events: none;
            z-index: 0;
        }

        .sheet::before {
            left: 0;
            mask-image: linear-gradient(90deg, #000, transparent);
            -webkit-mask-image: linear-gradient(90deg, #000, transparent);
            border-radius: 0 50% 50% 0 / 0 40% 40% 0;
        }

        .sheet::after {
            right: 0;
            mask-image: linear-gradient(270deg, #000, transparent);
            -webkit-mask-image: linear-gradient(270deg, #000, transparent);
            border-radius: 50% 0 0 50% / 40% 0 0 40%;
        }

        .watermark {
            position: absolute;
            right: 10%;
            top: 34%;
            width: 240px;
            height: 240px;
            opacity: 0.05;
            background: url('../assets/images/logo.jpeg') center top / cover no-repeat;
            pointer-events: none;
            z-index: 1;
        }

        /* Corner triangles — top-left */
        .corner-tl {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-top: 120px solid var(--navy);
            border-right: 120px solid transparent;
            z-index: 2;
        }

        .corner-tl-gold {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-top: 92px solid var(--gold);
            border-right: 92px solid transparent;
            z-index: 2;
        }

        .corner-tl-inner {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-top: 84px solid var(--cream);
            border-right: 84px solid transparent;
            z-index: 2;
        }

        /* Corner triangles — bottom-right */
        .corner-br {
            position: absolute;
            bottom: 0; right: 0;
            width: 0; height: 0;
            border-bottom: 120px solid var(--navy);
            border-left: 120px solid transparent;
            z-index: 2;
        }

        .corner-br-gold {
            position: absolute;
            bottom: 0; right: 0;
            width: 0; height: 0;
            border-bottom: 92px solid var(--gold);
            border-left: 92px solid transparent;
            z-index: 2;
        }

        .corner-br-inner {
            position: absolute;
            bottom: 0; right: 0;
            width: 0; height: 0;
            border-bottom: 84px solid var(--cream);
            border-left: 84px solid transparent;
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 3;
            height: 100%;
            padding: 20px 48px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .body-block {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex: 1;
            justify-content: space-evenly;
            min-height: 0;
            padding: 4px 0;
        }

        .bottom-block {
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* ---- HEADER ---- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            object-position: center 14%;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.22rem;
            color: var(--navy);
            letter-spacing: 0.04em;
            font-weight: 700;
            line-height: 1.1;
        }

        .brand-text .tag {
            font-family: 'Libre Baskerville', serif;
            font-style: italic;
            font-size: 0.68rem;
            color: #3d6bb3;
            margin-top: 2px;
        }

        .iaf {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .iaf-badge {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, #4a8fd4, #1a4f9c 60%, #0b2a5b 100%);
            border: 2px solid #c9a227;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.05;
            box-shadow: 0 2px 8px rgba(11, 42, 91, 0.25);
            flex-shrink: 0;
        }

        .iaf-badge .iaf-top {
            font-size: 0.42rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            opacity: 0.9;
        }

        .iaf-badge .iaf-mid {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.06em;
        }

        .iaf-badge .iaf-bot {
            font-size: 0.36rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            max-width: 42px;
            margin-top: 1px;
        }

        .iaf-copy {
            border-left: 1.5px solid var(--gold);
            padding-left: 10px;
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.35;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        /* ---- TITLE ---- */
        .title-block {
            text-align: center;
            margin-top: 0;
        }

        .certify-block {
            text-align: center;
        }

        .certify-block .intro { margin-bottom: 2px; }
        .certify-block .name-rule { margin-top: 2px; margin-bottom: 6px; }
        .certify-block .completed-line { margin-top: 0; }

        .course-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .title-block .of {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            color: var(--navy);
            text-transform: uppercase;
        }

        .title-block h2 {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.75rem;
            letter-spacing: 0.14em;
            color: var(--navy);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 2px;
        }

        .title-block h2::before,
        .title-block h2::after {
            content: '';
            width: 72px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .intro {
            text-align: center;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            color: var(--navy);
            margin-top: 0;
            text-transform: uppercase;
        }

        .student-name {
            text-align: center;
            font-family: 'Great Vibes', cursive;
            font-size: 2.85rem;
            color: var(--navy);
            line-height: 1.05;
            margin: 0 auto;
            padding: 0 40px;
            max-width: 900px;
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .name-rule {
            width: min(400px, 55%);
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto;
        }

        .completed-line {
            text-align: center;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.88rem;
            color: var(--ink);
            margin-bottom: 0;
        }

        /* ---- COURSE RIBBON ---- */
        .ribbon-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto 4px;
        }

        .ribbon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            min-width: 280px;
            max-width: 680px;
            padding: 11px 52px;
            text-align: center;
            background: linear-gradient(180deg, #1a4588 0%, var(--navy) 45%, var(--navy-deep) 100%);
        }

        /* Gold outline via slightly larger gold layer behind */
        .ribbon-outer {
            position: relative;
            display: inline-block;
            padding: 2.5px;
            background: var(--gold);
            filter: drop-shadow(0 4px 10px rgba(11, 42, 91, 0.28));
            clip-path: polygon(
                22px 0%,
                calc(100% - 22px) 0%,
                100% 50%,
                calc(100% - 22px) 100%,
                22px 100%,
                0% 50%
            );
        }

        .ribbon-text {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.22rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 580px;
            position: relative;
            z-index: 1;
        }

        .course-label {
            margin-top: 6px;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .course-label::before,
        .course-label::after {
            content: '';
            width: 48px;
            height: 1.5px;
            background: var(--gold);
        }

        .conducted {
            text-align: center;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.78rem;
            color: var(--ink);
            margin: 0;
        }

        /* ---- DATES ---- */
        .dates {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin: 0 auto;
        }

        .date-item {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 210px;
        }

        .date-item .cal {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            color: var(--navy);
        }

        .date-item .cal svg {
            width: 28px;
            height: 28px;
            display: block;
        }

        .date-copy .label {
            font-size: 0.62rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        .date-copy .value {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--navy);
            margin-top: 1px;
        }

        .dates-divider {
            width: 1.5px;
            height: 36px;
            background: var(--gold);
        }

        .ack {
            text-align: center;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.7rem;
            color: var(--muted);
            max-width: 620px;
            margin: 0 auto;
            line-height: 1.45;
        }

        /* ---- FOOTER ROW ---- */
        .footer-row {
            margin-top: 0;
            display: grid;
            grid-template-columns: 1.15fr 0.9fr 1.15fr;
            align-items: end;
            gap: 12px;
            padding: 0 8px;
        }

        .verify-col {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #qrcode {
            width: 70px;
            height: 70px;
            flex-shrink: 0;
            background: #fff;
            padding: 2px;
            border: 1px solid #e2e6ee;
        }

        #qrcode img,
        #qrcode canvas {
            width: 66px !important;
            height: 66px !important;
            display: block;
        }

        .verify-meta {
            font-size: 0.68rem;
            color: var(--navy);
            line-height: 1.45;
        }

        .verify-meta strong {
            font-weight: 800;
            letter-spacing: 0.01em;
        }

        .verify-meta .id {
            font-family: ui-monospace, Consolas, monospace;
            font-weight: 700;
        }

        .seal-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }

        .seal-col::before,
        .seal-col::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42px;
            height: 1.5px;
            background: var(--gold);
        }

        .seal-col::before { left: -8px; transform: translateY(-50%); }
        .seal-col::after { right: -8px; transform: translateY(-50%); }

        .gold-seal {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 28%, #f6e7a8, var(--gold) 50%, #8f7410 100%);
            border: 3px solid #efdea0;
            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.18),
                inset 0 0 0 3px rgba(11, 42, 91, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gold-seal .laurel {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .gold-seal img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            object-position: center 14%;
            border-radius: 50%;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.15));
        }

        .sig-col {
            text-align: center;
            padding-bottom: 2px;
        }

        .sig-col .sign {
            font-family: 'Great Vibes', cursive;
            font-size: 1.85rem;
            color: var(--navy);
            min-height: 40px;
            line-height: 1;
        }

        .sig-col .line {
            width: 168px;
            margin: 2px auto 6px;
            border-top: 1.2px solid #8a93a5;
        }

        .sig-col .who {
            font-family: 'Libre Baskerville', serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--navy);
        }

        .sig-col .role {
            font-size: 0.58rem;
            color: var(--muted);
            margin-top: 2px;
            letter-spacing: 0.02em;
        }

        .iso-footer {
            text-align: center;
            font-size: 0.5rem;
            color: var(--muted);
            letter-spacing: 0.02em;
            margin-top: 8px;
            padding-bottom: 0;
        }

        .loading, .error {
            color: #fff;
            text-align: center;
            padding: 80px 20px;
            font-size: 1.1rem;
        }

        .error { color: #ffb4b4; }

        @media print {
            body { background: #fff; padding: 0; }
            .toolbar { display: none !important; }
            .sheet {
                box-shadow: none;
                width: 297mm;
                height: 210mm;
            }
            @page { size: A4 landscape; margin: 0; }
        }
    </style>
</head>

<body>
    <div class="toolbar" id="toolbar">
        <button class="secondary" onclick="window.close()">Close</button>
        <button onclick="window.print()">Print / Save PDF</button>
    </div>
    <div id="root" class="loading">Loading certificate…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/admin.js"></script>
    <script>
        requireAdmin();

        const params = new URLSearchParams(location.search);
        const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
        const id = params.get('id') || hashParams.get('id') || sessionStorage.getItem('viewCertId');
        const certNo = params.get('cert') || hashParams.get('cert');
        if (id) sessionStorage.removeItem('viewCertId');

        function fmt(d) {
            if (!d) return '—';
            return new Date(d).toLocaleDateString('en-GB', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function esc(s) {
            return String(s || '').replace(/[&<>"']/g, m =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])
            );
        }

        function courseDisplayName(title) {
            const t = String(title || '').trim();
            return t.replace(/\s+course$/i, '').trim() || t;
        }

        async function load() {
            try {
                let cert;
                if (id) {
                    const res = await apiCall('/certificates/' + id);
                    cert = res.data;
                } else if (certNo) {
                    const res = await fetch(`${API_BASE}/certificates/verify/${encodeURIComponent(certNo)}`);
                    const data = await res.json();
                    if (!data.valid) throw new Error(data.message || 'Invalid');
                    cert = data.data;
                } else {
                    throw new Error('Missing certificate id');
                }
                render(cert);
            } catch (err) {
                document.getElementById('root').className = 'error';
                document.getElementById('root').textContent = err.message || 'Failed to load';
            }
        }

        function render(c) {
            const verifyUrl = `${location.origin}/pages/verify.html?id=${encodeURIComponent(c.certificateId)}`;
            const courseName = courseDisplayName(c.courseTitle);
            const ack = c.description && !/in-depth knowledge and hands-on experience/i.test(c.description)
                ? c.description
                : `This certificate acknowledges your dedication, hard work and successful completion of the ${courseName} course at Edunex Academy.`;

            document.title = `${c.certificateId} | Edunex Certificate`;
            document.getElementById('root').outerHTML = `
            <div class="sheet" id="root">
                <div class="corner-tl"></div>
                <div class="corner-tl-gold"></div>
                <div class="corner-tl-inner"></div>
                <div class="corner-br"></div>
                <div class="corner-br-gold"></div>
                <div class="corner-br-inner"></div>
                <div class="watermark"></div>
                <div class="content">
                    <div class="header">
                        <div class="brand">
                            <img src="../assets/images/logo.jpeg" alt="Edunex Academy">
                            <div class="brand-text">
                                <h1>EDUNEX ACADEMY</h1>
                                <div class="tag">Learn Today. Lead Tomorrow.</div>
                            </div>
                        </div>
                        <div class="iaf">
                            <div class="iaf-badge" aria-hidden="true">
                                <div class="iaf-top">INTERNATIONAL</div>
                                <div class="iaf-mid">IAF</div>
                                <div class="iaf-bot">Accreditation Forum</div>
                            </div>
                            <div class="iaf-copy">IAF Member<br>Global Recognition<br>for Quality</div>
                        </div>
                    </div>

                    <div class="body-block">
                    <div class="title-block">
                        <div class="of">CERTIFICATE OF</div>
                        <h2>COURSE COMPLETION</h2>
                    </div>

                    <div class="certify-block">
                        <div class="intro">This is to certify that</div>
                        <div class="student-name">${esc(c.studentName)}</div>
                        <div class="name-rule"></div>
                        <div class="completed-line">has successfully completed the</div>
                    </div>

                    <div class="course-block">
                        <div class="ribbon-wrap">
                            <div class="ribbon-outer">
                                <div class="ribbon">
                                    <div class="ribbon-text">${esc(courseName)}</div>
                                </div>
                            </div>
                            <div class="course-label">COURSE</div>
                        </div>
                        <div class="conducted">Conducted by Edunex Academy</div>
                    </div>

                    <div class="dates">
                        <div class="date-item">
                            <div class="cal" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                                    <path d="M3 9h18M8 3v4M16 3v4"/>
                                    <path d="M8 13h2M12 13h2M16 13h2M8 17h2M12 17h2"/>
                                </svg>
                            </div>
                            <div class="date-copy">
                                <div class="label">Course Start Date</div>
                                <div class="value">${fmt(c.startDate)}</div>
                            </div>
                        </div>
                        <div class="dates-divider"></div>
                        <div class="date-item">
                            <div class="cal" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                                    <path d="M3 9h18M8 3v4M16 3v4"/>
                                    <path d="M8 13h2M12 13h2M16 13h2M8 17h2M12 17h2"/>
                                </svg>
                            </div>
                            <div class="date-copy">
                                <div class="label">Course End Date</div>
                                <div class="value">${fmt(c.completionDate)}</div>
                            </div>
                        </div>
                    </div>

                    <p class="ack">${esc(ack)}</p>
                    </div>

                    <div class="bottom-block">
                    <div class="footer-row">
                        <div class="verify-col">
                            <div id="qrcode"></div>
                            <div class="verify-meta">
                                <div>Certificate ID: <span class="id">${esc(c.certificateId)}</span></div>
                                <div>Verify at: <strong>www.edunexacademy.in/verify</strong></div>
                            </div>
                        </div>
                        <div class="seal-col">
                            <div class="gold-seal">
                                <svg class="laurel" viewBox="0 0 100 100" aria-hidden="true">
                                    <circle cx="50" cy="50" r="38" fill="none" stroke="#6e5808" stroke-width="1.2" opacity="0.45"/>
